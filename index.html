<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>TAXI ÁNCASH | Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-dark:#0b1f33;
  --navy:#102b46;
  --blue:#1769aa;
  --blue-light:#eef7ff;
  --bg:#f3f6fa;
  --surface:#ffffff;
  --ink:#172334;
  --muted:#64748b;
  --line:#dce4ed;
  --gold:#f59e0b;
  --gold-bg:#fef3c7;
  --whatsapp:#25D366;
  --whatsapp-dark:#1ebe5d;
  --radius:16px;
  --shadow:0 4px 20px -2px rgba(16, 43, 70, 0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:white;padding:28px 20px 45px}
.wrap,main{max-width:760px;margin:auto}
.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#93c5fd;text-transform:uppercase}
h1{font-size:26px;font-weight:800;margin:6px 0 4px}
header p{margin:0;color:#cbd5e1;font-size:14px}
main{padding:0 14px 40px;margin-top:-25px;position:relative;z-index:10}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:13px;font-weight:700;color:#41536a;margin-bottom:6px}
input,select{width:100%;padding:11px 14px;border:1.5px solid #cbd5e1;border-radius:11px;background:#f8fafc;font:inherit;color:var(--ink);transition:all .2s}
input:focus,select:focus{outline:none;border-color:var(--blue);background:white;box-shadow:0 0 0 3px rgba(23,105,170,0.15)}
.full{grid-column:1/-1}.muted{color:var(--muted);font-size:13px}

/* Vehículos */
.vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vehicle{border:1.5px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;font-weight:700;background:white;transition:all .2s}
.vehicle:hover{border-color:var(--blue)}
.vehicle.active{border-color:var(--blue);background:var(--blue-light);color:#0c5794;box-shadow:0 2px 8px rgba(23,105,170,0.15)}
.vehicle-name{font-size:14px;font-weight:800}
.vehicle-plate{font-size:11px;color:var(--muted);font-family:monospace;margin-top:2px}

/* Asientos estilo cabina */
.cabin{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:14px;margin-top:10px}
.cabin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.seat{border:1.5px solid #cbd5e1;border-radius:10px;padding:12px 6px;text-align:center;font-weight:700;background:white;cursor:pointer;transition:all .15s;font-size:13px;display:flex;flex-direction:column;gap:2px}
.seat:hover:not(:disabled):not(.driver){border-color:var(--blue);background:var(--blue-light)}
.seat.driver{background:#e2e8f0;border-color:#cbd5e1;color:#64748b;cursor:default;font-size:11px}
.seat.selected{background:var(--blue);color:white;border-color:var(--blue);box-shadow:0 3px 10px rgba(23,105,170,0.3)}
.seat.taken{background:#e7ebf0;color:#9aa5b1;cursor:not-allowed;text-decoration:line-through}
.seat small{font-size:10px;font-weight:600}

/* Extras y resumen */
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.summary-box{background:#f8fafc;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7}
.summary-box b{color:var(--navy)}

.btn-group{display:flex;flex-direction:column;gap:10px;margin-top:14px}
button.action-btn{width:100%;border:0;border-radius:12px;background:var(--navy);color:white;padding:14px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
button.action-btn:hover{background:#163d61}
button.whatsapp{background:var(--whatsapp);color:#063b1b}
button.whatsapp:hover{background:var(--whatsapp-dark)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.notice{background:var(--gold-bg);border:1px solid #fde68a;color:#92400e;padding:12px 14px;border-radius:11px;font-size:13px;margin:12px 0}
footer{text-align:center;color:#8290a0;font-size:12px;padding:15px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy-dark);color:white;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.25);z-index:999;opacity:0;transition:all .3s cubic-bezier(0.16, 1, 0.3, 1);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

@media(max-width:520px){.grid{grid-template-columns:1fr}.vehicles{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">Transporte Ejecutivo</div>
    <h1>TAXI ÁNCASH</h1>
    <p>San Marcos ↔ Antamina · Reserva tu asiento con anticipación</p>
  </div>
</header>

<main>
  <section class="card">
    <h2>1. Datos del viaje</h2>
    <div class="grid">
      <div>
        <label for="date">Fecha de salida</label>
        <input id="date" type="date">
      </div>
      <div>
        <label for="time">Hora de salida</label>
        <select id="time">
          <option value="19:00">7:00 p. m.</option>
          <option value="18:00">6:00 p
